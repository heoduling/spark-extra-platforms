plugins {
    id 'com.gradleup.shadow' version '8.3.8'
    id 'io.papermc.paperweight.userdev'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

java {
    disableAutoTargetJvm()
}

def shirohaVersion = "${project.baseVersion}-shiroha.5"
def shirohaDescription = 'spark 是适用于 Minecraft 服务端的性能分析工具。'

dependencies {
    implementation "me.lucko:spark-common:${project.baseVersion}-SNAPSHOT"
    implementation(project(':spark-folia:spark-folia-12111-compat')) {
        transitive = false
    }
    paperweight.foliaDevBundle("26.2.build.6-beta")

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

repositories {
    maven { url "https://repo.papermc.io/repository/maven-public/" }
}

processResources {
    from(sourceSets.main.resources.srcDirs) {
        expand (
                'pluginVersion': shirohaVersion,
                'pluginDescription': shirohaDescription
        )
        include 'plugin.yml'
    }
}

shadowJar {
    archiveFileName = "spark-${shirohaVersion}-folia.jar"

    dependencies {
        exclude(dependency('net.kyori:^(?!adventure-text-feature-pagination).+$'))
    }

    relocate 'net.kyori.adventure.text.feature.pagination', 'me.lucko.spark.lib.adventure.pagination'
    relocate 'net.bytebuddy', 'me.lucko.spark.lib.bytebuddy'
    relocate 'com.google.protobuf', 'me.lucko.spark.lib.protobuf'
    relocate 'org.objectweb.asm', 'me.lucko.spark.lib.asm'
    relocate 'one.profiler', 'me.lucko.spark.lib.asyncprofiler'
    relocate 'me.lucko.bytesocks.client', 'me.lucko.spark.lib.bytesocks'
    relocate 'org.java_websocket', 'me.lucko.spark.lib.bytesocks.ws'

    project.applyExcludes(delegate)
}

artifacts {
    archives shadowJar
    shadow shadowJar
}
